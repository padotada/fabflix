<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login to FabFlix</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src='https://www.google.com/recaptcha/api.js' type="text/javascript"></script>
</head>

<body class="bg-light">

<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Login to FabFlix</h2>

          <form id="login_form" method="post" action="#">
            <div class="form-group">
              <label for="username"><b>Username</b></label>
              <input
                      id="username"
                      name="username"
                      placeholder="Enter Username"
                      type="text"
                      class="form-control">
            </div>

            <div class="form-group">
              <label for="password"><b>Password</b></label>
              <input
                      id="password"
                      name="password"
                      placeholder="Enter Password"
                      type="password"
                      class="form-control">
            </div>

            <input
                    type="submit"
                    value="Login"
                    class="btn btn-primary btn-block">
            <div class="g-recaptcha" data-sitekey="6LfgX88sAAAAAB76g3MiEgBqBDGbhGiTOnxzGQCV"></div>
          </form>



          <div id="login_error_message" class="text-danger text-center mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- include jQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!-- include our own JS file -->
<script src="./login.js"></script>
</body>
</html>
