<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <h1 class="mb-4">Employee Dashboard</h1>

    <div class="card mb-4">
        <div class="card-body">
            <h2>Add Star</h2>
            <form id="add-star-form">
                <div class="form-group">
                    <label for="star-name">Star Name</label>
                    <input id="star-name" name="name" type="text"  class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="star-birth-year">Birth Year</label>
                    <input id="star-birth-year" name="birthYear" type="number" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary">Add Star</button>
            </form>
            <div id="add-star-message" class="mt-3"></div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2>Database Metadata</h2>
            <button id="load-metadata-button"  class="btn btn-secondary mb-3">Load Metadata</button>
            <div id="metadata-container"></div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2>Add Movie</h2>
            <form id="add-movie-form">
                <div class="form-group">
                    <label for="movie-title">Movie Title</label>
                    <input id="movie-title" name="title" type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="movie-year">Movie Year</label>
                    <input id="movie-year" name="year" type="number" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="movie-director">Movie Director</label>
                    <input id="movie-director" name="director" type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="star-name-for-movie">Star Name</label>
                    <input id="star-name-for-movie" name="starName" type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="genre-name-for-movie">Genre Name</label>
                    <input id="genre-name-for-movie" name="genreName" type="text" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Movie</button>
            </form>
            <div id="add-movie-message" class="mt-3"></div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="./_dashboard.js"></script>
</div>
</body>
</html>
