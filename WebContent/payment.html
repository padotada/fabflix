<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <title>Payment</title>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Payment</h1>
        <div class="mb-3">
            <h4 id="payment_total">Total: $0.00</h4>
        </div>

        <div id="payment_error" class="alert alert-danger" style="display: none;"></div>

        <form id="payment_form">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" class="form-control" id="first_name" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" class="form-control" id="last_name" name="lastName" required>
            </div>

            <div class="form-group">
                <label for="credit_card_id">Credit Card Number</label>
                <input type="text" class="form-control" id="credit_card_id" name="creditCardId" required>
            </div>

            <div class="form-group">
                <label for="expiration">Expiration Date</label>
                <input type="date" class="form-control" id="expiration" name="expiration" required>
            </div>

            <button type="submit" class="btn btn-success">Place Order</button>
            <a href="cart.html" class="btn btn-secondary ml-2">Back to Cart</a>
        </form>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="payment.js"></script>
</body>
</html>
