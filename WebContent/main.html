<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>FabFlix</title>
</head>
<body>
  <form action="#" method="get">
    <p>Search By </p>
    <input type="search" name="title" id="title" placeholder="Title">
    <input type="number" min="1880" max="2099" name="year" id="year" placeholder="Year">
    <input type="search" name="director" id="director" placeholder="Director">
    <input type="search" name="star" id="star" placeholder="Star">
    <button type="submit">Search</button>
  </form>

  
</body>
</html>
