<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>Fabflix Movies</title>
</head>
<body>

<div class="d-flex gap-3 justify-content-around align-items-stretch">
    <div class="p-2">
        <h2>Search Movies</h2>
        <form id="search_form" action="#" method="GET">
            <div class="d-flex p-2 gap-3 flex-column">
            <label for="title"></label><input type="text" name="title" id="title" placeholder="Title">
            <label for="year"></label><input type="number" name="year" id="year" placeholder="Year">
            <label for="director"></label><input type="text" name="director" id="director" placeholder="Director">
            <label for="star"></label><input type="text" name="star" id="star" placeholder="Star">
            <button type="submit">Search</button>
            </div>
        </form>
    </div>
    <div class="p-2">
        <h2>Browse Movies</h2>
        <div class="d-flex gap-10">
            <div>
                By first letter:
                <form id="browse_letter" action="#" method="GET">
                    <select name="first_letter" id="letters">
                    </select>

                    <button type="submit">Search</button>
                </form>
            </div>

            <div>
                By genre:
                <form id="browse_genre" action="#" method="GET">
                    <select name="genre" id="genres">

                    </select>

                    <button type="submit">Search</button>
                </form>
            </div>

        </div>
    </div>
</div>


<h1>Movies</h1>

<table id=movies_table class="table table-striped">
    <!-- Create a table header -->
    <thead>
    <tr>
        <!-- Titles of each column-->
        <th>Title</th>
        <th>Year</th>
        <th>Director</th>
        <th>Genres</th>
        <th>Stars</th>
        <th>Rating</th>
        <th>Price</th>
        <th>Cart</th>
    </tr>
    </thead>
    <!-- Table body is left empty here, will be populated with the data retrieved with index.js -->
    <tbody id=movies_table_body></tbody>
</table>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<!-- Load our own JS file -->
<!-- The path is relative to index.html, since these two files are in the same directory -->
<!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
     otherwise the url is relative to the root path-->
<script src="movie-list.js"></script>
</body>


</html>
